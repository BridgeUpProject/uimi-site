.tabs{margin-top:40px}
.tablist{position:relative;isolation:isolate;display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:760px){.tablist{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:4px 18px 12px;scroll-padding:0 18px}.tablist::-webkit-scrollbar{display:none}}
.tablist button{position:relative;z-index:1;flex:none;border:0;cursor:pointer;background:#fff;box-shadow:0 0 0 1px var(--ring);border-radius:999px;padding:13px 17px;font:800 14px/1 var(--display);color:var(--slate);transition:color .3s var(--ease),background-color .3s var(--ease),scale .14s var(--ease)}
.tablist button:active{scale:.96}
.tablist button[aria-selected=true]{background:var(--charcoal);color:#fff}
.js-tabs .tablist button{background:transparent}
.js-tabs .tablist button[aria-selected=true]{color:var(--charcoal)}
.js-tabs .tablist button.lit{color:#fff}
.tab-ind{position:absolute;left:0;top:0;z-index:0;border-radius:999px;background:var(--charcoal);pointer-events:none}
.tabpanel{margin-top:22px;outline-offset:6px}
.tabpanel+.tabpanel{margin-top:30px}
html.js .tabpanel[data-idle]{display:none}
.js-tabs .tabpanel+.tabpanel{margin-top:22px}
.tab-sub{margin:0 0 14px;color:var(--slate);font-size:16px}
.tab-format{display:block;margin-top:4px;font-size:14px;color:var(--blue);font-weight:700}
.sit-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.sit-chips li{background:#fff;border-radius:16px;padding:14px 18px;font:800 16px/1.25 var(--display);letter-spacing:-.01em;box-shadow:0 0 0 1px var(--ring);transition:box-shadow .25s var(--ease)}
@media (hover:hover) and (pointer:fine){.sit-chips li:hover{box-shadow:0 0 0 1.5px var(--blue)}}
.peek{position:fixed;left:0;top:0;z-index:15;width:320px;pointer-events:none}
.peek .bezel{opacity:0;transform:scale(.92);transform-origin:0 0}
.peek .core{padding:18px 20px 20px}
.peek p{margin:10px 0 0;font-size:15px;line-height:1.5;color:var(--ink-soft)}
@media (hover:none),(pointer:coarse){.peek{display:none}}
.dark-shell{background:var(--charcoal);color:#fff;border-radius:48px;padding:clamp(48px,7vw,96px) 0}
.dark-shell .pill{background:rgba(255,255,255,.08);color:#C3CBD5;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.privacy h2{color:#fff;margin-top:22px;font-size:clamp(32px,4.6vw,60px);line-height:1.06}
.priv-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:56px;align-items:end}
@media (max-width:979px){.priv-head{grid-template-columns:1fr;gap:36px}}
.dots{--rows:7;--gap:18px;display:grid;grid-template-columns:repeat(var(--cols,14),6px);grid-auto-rows:6px;gap:var(--gap);padding:6px;height:calc(var(--rows) * 6px + (var(--rows) - 1) * var(--gap) + 12px)}
@media (max-width:979px){.dots{--rows:4;--gap:15px}}
.dots i{width:6px;height:6px;border-radius:50%;background:#9FB4D8;opacity:.3}
.pgrid{list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:980px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.pgrid{grid-template-columns:1fr}}
.pgrid li{padding:6px;border-radius:30px;background:rgba(255,255,255,.04);box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.pgrid li>div{height:100%;border-radius:24px;padding:24px;background:rgba(255,255,255,.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.pgrid h3{color:#fff;font-size:19px;margin-bottom:6px}
.pgrid p{margin:0;color:#C3CBD5;font-size:15.5px;line-height:1.55}
.pgrid .k{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:14px;background:rgba(159,180,216,.14);margin-bottom:16px}
.pgrid .k svg{width:22px;height:22px;fill:none;stroke:#DCE5F4;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.parents{margin-top:28px;padding:26px 28px;border-radius:30px;background:var(--blue-tint);box-shadow:inset 0 0 0 1px var(--ring)}
.parents h3{color:var(--charcoal);font-size:19px}
.parents p{margin:8px 0 0;color:var(--slate);max-width:860px}
.faq{margin-top:48px}
.faq details{border-bottom:1px solid rgba(47,55,64,.12)}
.faq summary{cursor:pointer;list-style:none;font:800 clamp(18px,2vw,22px)/1.3 var(--display);letter-spacing:-.02em;padding:26px 56px 26px 0;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary .pm{position:absolute;right:0;top:50%;width:36px;height:36px;margin-top:-18px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--ring);transition:transform .5s var(--ease),background-color .3s var(--ease)}
.faq summary .pm::before,.faq summary .pm::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2px;margin:-1px 0 0 -6px;background:var(--charcoal);border-radius:2px;transition:transform .5s var(--ease)}
.faq summary .pm::after{transform:rotate(90deg)}
.faq details[open] summary .pm{transform:rotate(180deg);background:var(--blue-soft)}
.faq details[open] summary .pm::after{transform:rotate(0)}
.faq details.closing summary .pm{transform:none;background:#fff}
.faq details.closing summary .pm::after{transform:rotate(90deg)}
.faq .ans{overflow:hidden}
.faq .ans p{margin:0 0 28px;color:var(--slate);max-width:680px}
.closing{text-align:center}
.closing h2,.closing h1{font-size:clamp(44px,7vw,96px)}
.closing .join,.closing .done{margin-left:auto;margin-right:auto;text-align:left}
.closing .lede{max-width:520px}
.closing .penguin{width:110px;height:auto;margin:0 auto 26px;display:block;transform-origin:50% 90%}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.confetti i{position:absolute;left:0;top:0;width:9px;height:9px;border-radius:50%}
.confetti i.p{width:15px;height:6px;border-radius:9px}
.signoff{text-align:center;padding-bottom:12px}
.bigmark{display:flex;justify-content:center;overflow:hidden;padding:.3em 0 .04em;margin:8px 0 0;font-size:clamp(104px,24vw,340px);line-height:1}
.bigmark .wordmark,footer.site .bigmark .wordmark{font-size:1em;letter-spacing:-.04em;user-select:none;-webkit-user-select:none}
.bigmark .ch{display:inline-block}
.bigmark .dot{background:none}
.bigmark .dot b{display:block;width:100%;height:100%;border-radius:50%;background:var(--blue)}
.brand-line{margin:10px 0 0;font:800 clamp(13px,1.4vw,16px)/1.2 var(--display);letter-spacing:.26em;text-transform:uppercase;color:var(--slate)}
.doc-page{padding:128px 0 40px}
.doc .core{padding:32px clamp(20px,5vw,48px)}
.doc h1{font-size:clamp(30px,5vw,48px);margin-bottom:14px}
.doc h2{font-size:23px;margin:40px 0 10px}
.doc h3{font-size:18px;margin:26px 0 8px}
.doc p,.doc li{color:var(--slate)}
.doc strong{color:var(--charcoal)}
.doc ul{padding-left:20px}
.table{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;margin:10px 0 18px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid rgba(47,55,64,.08)}
th{font:800 12px/1.3 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td{color:var(--slate)}
@media (max-width:560px){thead{display:none}tr{display:block;border-bottom:1px solid rgba(47,55,64,.08);padding:8px 0}td{display:block;border:0;padding:4px 0}td::before{content:attr(data-label);display:block;font:800 11px/1.3 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}}
footer.site{padding:36px 0 96px;color:var(--muted);font-size:14px}
footer.site .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid rgba(47,55,64,.1);padding-top:28px}
footer.site .wordmark{font-size:22px}
footer.site .pause{border:0;background:none;padding:0;font:inherit;color:var(--blue-deep);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
html.js:not(.ready) [data-intro]{visibility:hidden}
html.paused *,html.paused *::before,html.paused *::after{animation:none!important;transition-property:color,background-color,border-color,box-shadow,opacity,text-decoration-color,fill,stroke!important}
html.paused .btn:active,html.paused .roles button:active,html.paused .tablist button:active,html.paused .share button:active{scale:none}
@media (hover:hover) and (pointer:fine){html.paused .btn:hover .ico{transform:none}}
